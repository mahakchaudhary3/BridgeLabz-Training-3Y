<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <form>
        <label for="name" > Name: </label>  
        <input id="namr" type="text"
        placeholder="Enter your name" name="name">

        <br>
        <br>

        <label for="email">Email: </label>
        <input id="email" type="email" placeholder="example.com" name="email" >
        <br>
        <br>

        <label for="phone no.">Phone No.</label>
        <input id="phone" type="number" placeholder="enter ur no." name="phone" value="91">
        <br>
        <br>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter ur password" name="password">
        <br>
        <br>


        <label for="skills">Skills</label>
        <select name="skills" size="3">
            <option value="html">Html</option>
            <option value="css">CSS</option>
            <option value="SQL">SQL</option>
            <option value="python">Python</option>
        </select>
        <br>
        <br>


        <section>
            <label>Gender: </label>
            <input id="male" type="radio" name="Gender" value="male">
            <label for="male">Male</label>
            <input id="female" type="radio" name="Gender" value="female">
            <label for="female">Female</label>
        </section>
        <br>

        <section>
            <label>Skills</label>
            <input type="checkbox" value="HTML">
            <label>HTML</label>
            <input type="checkbox" value="js">
            <label>js</label>
            <input type="checkbox" value="CSS">
            <label>CSS</label>
            
        </section>

        <br>
        <label for="date">date</label>
        <input id="date" type="date" name="date">
        <textarea></textarea>
        <br>
        <br>

        <input type="file" name="file">
        <br>
        
        <input type="range" max="3">
        <br>
        
        <button type="submit">Submit</button>

      </form>
</body>
</html>
