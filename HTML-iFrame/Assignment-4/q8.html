<!DOCTYPE html>
<html lang="en">

<head>

    <!-- <title> sets the title displayed on the browser tab -->
    <title>My HTML Page</title>

    <!-- <meta charset> defines the character encoding of the webpage -->
    <meta charset="UTF-8">

    <!-- <meta description> provides a short description of the webpage -->
    <meta name="description" content="This is a simple HTML webpage.">

    <!-- <meta author> specifies the author of the webpage -->
    <meta name="author" content="Mahak">

    <!-- <base> sets the base URL for relative links on the webpage -->
    <base href="https://example.com/">

    <!-- <link> connects external resources such as favicon or CSS -->
    <link rel="icon" href="favicon.ico">

    <!-- <style> is used to write CSS styles for the webpage -->
    <style>
        /* CSS can be written here */
    </style>

    <!-- <script> is used to add JavaScript to the webpage -->
    <script>
        // JavaScript can be written here
    </script>

</head>

<body>

    <h1>Welcome to My Webpage</h1>
    <p>This page demonstrates important HTML head elements.</p>

</body>

</html>
