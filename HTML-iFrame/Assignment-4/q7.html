<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotations</title>
</head>
<body>

    <h1>HTML Quotations</h1>

    <blockquote>
        Learning HTML is an important step in web development.
        It helps us create structured webpages using tags and entities
        such as &amp; to represent special characters.
    </blockquote>

    <p>
        My teacher always says, <q>Practice makes perfect.</q>
        This short quotation is written using the q tag.
    </p>

</body>
</html>
