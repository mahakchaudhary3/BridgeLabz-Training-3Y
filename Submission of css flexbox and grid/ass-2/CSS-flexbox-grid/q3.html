<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <!-- Header -->
        <header>
            <h2>My Dashboard</h2>
        </header>

        <!-- Sidebar -->
        <aside>
            <h3>Menu</h3>
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </aside>

        <!-- Main Content -->
        <main>

            <div class="box box1">
                <h2>Statistics</h2>
                <p>View your latest statistics.</p>
            </div>

            <div class="box box2">
                <h2>Projects</h2>
                <p>Manage your projects.</p>
            </div>

            <div class="box box3">
                <h2>Tasks</h2>
                <p>Check your pending tasks.</p>
            </div>

            <div class="box box4">
                <h2>Notifications</h2>
                <p>View your latest notifications.</p>
            </div>

        </main>

    </div>

</body>
</html>
